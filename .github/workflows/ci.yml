name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./... && go test ./...
      - run: ./scripts/validate-manifest.sh .
      # The plugin ships bin/skk-popup-engine-linux-*; make sure they rebuild
      # from the current source for every target arch, and flag it when the
      # committed copies are stale.
      - run: make vendor-engine
      - run: |
          if ! git diff --quiet -- bin/; then
            echo "::warning::vendored engine binaries differ from a fresh build — run 'make vendor-engine' and commit"
            git diff --stat -- bin/
          fi
